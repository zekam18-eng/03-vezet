<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>03-Везём</title>
<link rel="stylesheet" href="style.css">
<script src="https://telegram.org/js/telegram-web-app.js"></script>
</head>
<body>

<div id="app">

  <header class="topbar">
    <div class="topbar-title" id="topbarTitle">Карта СМП</div>
    <div class="topbar-actions">
      <button class="icon-btn" id="addBtn" title="Добавить" aria-label="Добавить">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none"><path d="M12 5v14M5 12h14" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>
      </button>
      <button class="icon-btn" id="historyBtn" title="История сохранённых карт" aria-label="История">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none"><path d="M3 12a9 9 0 1 0 3-6.7" stroke="currentColor" stroke-width="2" stroke-linecap="round"/><path d="M3 4v5h5" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M12 8v4l3 2" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>
      </button>
    </div>
  </header>

  <nav class="tabs" id="tabs">
    <button class="tab active" data-tab="emergency">Карта СМП</button>
    <button class="tab" data-tab="reanimation">Реанимация</button>
    <button class="tab" data-tab="localStatus">Локальный статус</button>
    <button class="tab" data-tab="lookup">Подкрадули</button>
  </nav>

  <div class="search-row" id="searchRow">
    <svg class="search-icon" width="16" height="16" viewBox="0 0 24 24" fill="none"><circle cx="11" cy="11" r="7" stroke="currentColor" stroke-width="2"/><path d="m20 20-3.5-3.5" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>
    <input type="text" id="searchInput" placeholder="Поиск по диагнозу или коду МКБ…" autocomplete="off">
  </div>

  <main id="listView" class="list-view"></main>

  <main id="detailView" class="detail-view hidden">
    <button class="back-btn" id="backBtn">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none"><path d="M15 18l-6-6 6-6" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>
      Назад
    </button>
    <div class="detail-header">
      <h1 id="detailTitle"></h1>
      <span class="mkb-pill" id="detailMkb"></span>
    </div>
    <div id="detailFields"></div>
    <div class="detail-actions">
      <button class="btn btn-secondary" id="copyBtn">Скопировать</button>
      <button class="btn btn-primary" id="saveBtn">Сохранить</button>
    </div>
  </main>

  <main id="historyView" class="list-view hidden">
    <div class="history-header">
      <button class="back-btn" id="historyBackBtn">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none"><path d="M15 18l-6-6 6-6" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>
        Назад
      </button>
      <h2>Сохранённые карты</h2>
    </div>
    <div id="historyList"></div>
  </main>

  <main id="lookupView" class="lookup-view hidden">
    <p class="lookup-hint">Введите номер наряда (обычно 10 цифр) — карта откроется в браузере.</p>
    <div class="search-row">
      <input type="text" id="lookupInput" placeholder="Номер наряда…" inputmode="numeric" autocomplete="off">
    </div>
    <button class="btn btn-primary" id="lookupBtn">Открыть карту</button>
    <p class="lookup-note" id="lookupNote"></p>
  </main>

  <div id="toast" class="toast"></div>

</div>

<script src="app.js"></script>
</body>
</html>
